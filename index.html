<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Icons ────────────────────────────────────────────────────────────
         TWO DRAWINGS, AND THE CROSSOVER IS MEASURED.

         The brand artwork is a lattice with no enclosed counter - it is split
         down the centre, so every interior channel opens to the outside. At
         16px its bands land on ~2px and its channels on ~1px, and it resolves
         to a grey smudge with no structure. At 32px it reads cleanly. So 16px
         uses a simplified drawing derived from the artwork's own silhouette,
         and everything from 32px up uses the artwork itself.

         favicon.ico carries 16/32/48 because browsers still reach for it in
         places the <link> tags do not cover - bookmark bars, history, pinned
         tabs - and it is requested from / whether or not it is declared.

         apple-touch-icon is a flat opaque square on purpose: iOS composites
         alpha against BLACK and applies its own corner radius. -->
    <meta name="theme-color" content="#050B12" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Cabinet Grotesk (display) + General Sans (body), Fontshare CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
    />
    <!-- Geist (body/display on the landing page) is self-hosted: preload for fast hero paint -->
    <link rel="preload" href="/fonts/geist/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary SEO -->
    <title>Orkastor — Infrastructure for teams who run Kubernetes</title>

    <meta property="og:title" content="Orkastor — Infrastructure for teams who run Kubernetes" />
    <meta property="og:description" content="Orkastor builds infrastructure software for Kubernetes teams. KubeGraf is an AI SRE for the clusters you already run. Domineta provides ephemeral environments with a real kernel boundary." />
    <meta property="og:image" content="https://www.orkastor.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://www.orkastor.com/og-image.png" />
